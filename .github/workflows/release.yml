name: Release

# Em push de tag v*: baixa o .deb oficial, valida que build-appimage.sh funciona
# com a versão publicada e cria a release (sem binários anexados).
#
# O AppImage NÃO é publicado aqui de propósito: ToneLib-GFX é proprietário e a
# licença não permite redistribuição. Cada usuário gera o binário localmente com
# ./build-appimage.sh a partir do .deb oficial.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build AppImage
        id: build
        run: |
          # Não instalamos squashfs-tools aqui de propósito: o próprio script
          # pede sudo e instala o que faltar (exercita lib/root.sh no CI).
          chmod +x build-appimage.sh
          ./build-appimage.sh --download

          APPIMAGE="ToneLib-GFX-amd64.AppImage"
          [ -x "$APPIMAGE" ] || { echo "::error::build-appimage.sh não gerou $APPIMAGE"; exit 1; }
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"

          # Versão vem do .deb ("4.9-5" -> "4.9.5"), não do nome do arquivo
          DEB_VERSION=$(dpkg-deb -f ToneLib-GFX-amd64.deb Version)
          echo "version=${DEB_VERSION//-/.}" >> "$GITHUB_OUTPUT"

      - name: Check tag format
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # A tag é a versão DESTE empacotamento (vX.Y.Z); a versão do ToneLib
          # vem do .deb e vai no título/notas da release.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="${{ steps.build.outputs.version }}"
          echo "empacotamento (tag)=$TAG_VERSION | ToneLib (pacote)=$PKG_VERSION"
          if ! echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $GITHUB_REF_NAME deve ser vX.Y.Z (versão do empacotamento)."
            exit 1
          fi

      - name: Smoke test (headless)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb x11-utils x11-xserver-utils libgl1-mesa-dri \
            libasound2t64 libpulse0 libx11-6 libxext6 libxinerama1 libxcursor1 \
            libxrandr2 libxrender1 libxss1 libfontconfig1 libfreetype6 libcurl3t64-gnutls
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          APPIMAGE="${{ steps.build.outputs.appimage }}"
          APPIMAGE_EXTRACT_AND_RUN=1 "./$APPIMAGE" > appimage.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 12); do
            sleep 5
            if xwininfo -root -tree | grep -q 'ToneLib GFX'; then
              echo "Janela criada após $((i*5))s"
              xwininfo -root -tree | grep 'ToneLib GFX'
              kill "$APP_PID" || true
              exit 0
            fi
          done
          echo "::error::O AppImage não abriu nenhuma janela"
          tail -30 appimage.log
          kill "$APP_PID" || true
          exit 1

      - name: Docker build + smoke test
        run: |
          export USER_ID=$(id -u)
          export GROUP_ID=$(id -g)
          export TONELIB_DEB_SHA=$(sha256sum ToneLib-GFX-amd64.deb | cut -d' ' -f1)

          # Valida o Dockerfile (Ubuntu 24.04) e o compose
          docker compose build

          # O runner não tem /dev/snd nem /dev/dri, então não dá para usar o
          # compose.yml aqui: sobe só X11 e confere se a janela aparece
          export DISPLAY=:98
          Xvfb :98 -screen 0 1280x800x24 &
          sleep 3
          xhost +local:docker || true

          docker run -d --name tonelib-ci \
            -e DISPLAY=:98 \
            -e QT_X11_NO_MITSHM=1 \
            -v /tmp/.X11-unix:/tmp/.X11-unix:rw \
            tonelib-gfx:latest

          for i in $(seq 1 12); do
            sleep 5
            if xwininfo -display :98 -root -tree | grep -q 'ToneLib GFX'; then
              echo "Janela do container criada após $((i*5))s"
              xwininfo -display :98 -root -tree | grep 'ToneLib GFX'
              docker logs --tail 20 tonelib-ci
              docker rm -f tonelib-ci
              exit 0
            fi
          done
          echo "::error::A imagem Docker não abriu nenhuma janela"
          docker logs --tail 50 tonelib-ci
          docker rm -f tonelib-ci || true
          exit 1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Empacotamento ${GITHUB_REF_NAME#v} para o ToneLib-GFX ${{ steps.build.outputs.version }}.

          Esta release **não inclui binários**: ToneLib-GFX é proprietário e não é redistribuído aqui.

          ## Como obter o app

          1. Baixe \`ToneLib-GFX-amd64.deb\` (Ubuntu 64-bit) em https://tonelib.net/gfx-overview/
          2. Clone este repositório e coloque o \`.deb\` na raiz
          3. Gere o AppImage:
             \`\`\`bash
             ./build-appimage.sh          # --download baixa o .deb se faltar
             ./ToneLib-GFX-amd64.AppImage
             \`\`\`
             Ou use Docker: \`./run.sh\`

          Os scripts pedem a senha do sudo e instalam \`squashfs-tools\`/\`curl\` se faltar.
          Build desta release validado no CI (Ubuntu 24.04, smoke test com Xvfb + imagem Docker).

          Requisitos: x86_64, glibc >= 2.27, X11 ou XWayland, driver OpenGL, ALSA ou PulseAudio.
          Sem FUSE: \`APPIMAGE_EXTRACT_AND_RUN=1 ./ToneLib-GFX-amd64.AppImage\`"

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --title "Empacotamento ${GITHUB_REF_NAME#v} — ToneLib-GFX ${{ steps.build.outputs.version }}" --notes "$NOTES"
          fi
